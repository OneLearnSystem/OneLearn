<!-- ONELEARN STATUS MESSAGE -->
<div id="onelearn-status"></div>

<script>
  // OPTIONS: "downtime", "partial", "off"
  const ONELEARN_STATUS = "partial";

  const statusBox = document.getElementById("onelearn-status");

  if (ONELEARN_STATUS === "downtime") {
    statusBox.innerHTML = "🔴 <b>Downtime</b> — OneLearn is temporarily unavailable.";
    statusBox.style.background = "#fee2e2";
    statusBox.style.color = "#991b1b";
  }

  if (ONELEARN_STATUS === "partial") {
    statusBox.innerHTML = "🟠 <b>Partial Outage</b> — Some OneLearn features may be unavailable.";
    statusBox.style.background = "#fff7ed";
    statusBox.style.color = "#9a3412";
  }

  if (ONELEARN_STATUS !== "off") {
    statusBox.style.padding = "12px 18px";
    statusBox.style.textAlign = "center";
    statusBox.style.fontFamily = "Arial, sans-serif";
    statusBox.style.fontSize = "14px";
    statusBox.style.fontWeight = "500";
  }
</script>
